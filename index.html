        function addVariantToCart(productId, variantId) {
            const product = (state.products || []).find(p => p.id === productId);
            if (!product) return;
            const variant = (product.product_variants || []).find(v => v.id === variantId);
            if (!variant) return;

            const existingIndex = state.cart.findIndex(i => i.productId === productId && i.variantId === variantId);
            const currentQtyInCart = existingIndex > -1 ? state.cart[existingIndex].qty : 0;

            if (currentQtyInCart + 1 > variant.quantity) {
                showToast('Нельзя добавить больше, чем есть на складе!', 'error');
                return;
            }

            if (existingIndex > -1) {
                state.cart[existingIndex].qty += 1;
            } else {
                state.cart.push({
                    productId: product.id,
                    variantId: variant.id,
                    name: product.name,
                    variantName: variant.value,
                    price: product.retail_price,
                    wholesalePrice: product.wholesale_price,
                    image: product.image_url,
                    qty: 1,
                    maxQty: variant.quantity
                });
            }

            localStorage.setItem('reflex_cart', JSON.stringify(state.cart));
            closeModal('modal-variant-select');
            showToast('Товар добавлен в корзину');
            render();
        }

        function addToCart(productId, variantId) {
            addVariantToCart(productId, variantId);
        }

        function updateCartQty(idx, delta) {
            const item = state.cart[idx];
            const product = (state.products || []).find(p => p.id === item.productId);
            let availableStock = item.maxQty;
            if (product) {
                const variant = (product.product_variants || []).find(v => v.id === item.variantId);
                if (variant) availableStock = variant.quantity;
            }

            if (delta > 0 && item.qty + delta > availableStock) {
                showToast('Достигнут максимальный остаток на складе!', 'error');
                return;
            }

            item.qty += delta;
            if (item.qty <= 0) {
                state.cart.splice(idx, 1);
                showToast('Вкус удален из корзины');
            }
            localStorage.setItem('reflex_cart', JSON.stringify(state.cart));
            render();
        }

        async function checkoutOrder() {
            if (!state.user) {
                showToast('Пожалуйста, укажите ваш юз в профиле!', 'error');
                switchTab('profile');
                return;
            }
            if (state.cart.length === 0) return;

            await fetchProducts();

            for (const item of state.cart) {
                const product = (state.products || []).find(p => p.id === item.productId);
                if (!product) {
                    showToast(`Товар "${item.name}" больше недоступен. Корзина будет обновлена.`, 'error');
                    validateCartStock();
                    render();
                    return;
                }

                const variant = (product.product_variants || []).find(v => v.id === item.variantId);
                if (!variant || variant.quantity < item.qty) {
                    const available = variant ? variant.quantity : 0;
                    showToast(`Вкус "${item.variantName}" товара "${item.name}" остался в количестве: ${available} шт.`, 'error');
                    validateCartStock();
                    render();
                    return;
                }
            }

            const totalRetail = state.cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const totalWholesale = state.cart.reduce((sum, i) => sum + (i.wholesalePrice * i.qty), 0);

            const { data: orderData, error: orderError } = await supabaseClient.from('orders').insert({
                username: state.user,
                status: 'in_progress',
                total_retail: totalRetail,
                total_wholesale: totalWholesale
            }).select().single();

            if (orderError) {
                showToast('Ошибка оформления заказа: ' + orderError.message, 'error');
                return;
            }

            const itemsToInsert = state.cart.map(i => ({
                order_id: orderData.id,
                product_id: i.productId,
                variant_id: i.variantId,
                product_name: i.name,
                variant_name: i.variantName,
                quantity: i.qty,
                price: i.price,
                wholesale_price: i.wholesalePrice
            }));

            await supabaseClient.from('order_items').insert(itemsToInsert);

            for (const item of state.cart) {
                const product = (state.products || []).find(p => p.id === item.productId);
                if (product) {
                    const variant = (product.product_variants || []).find(v => v.id === item.variantId);
                    if (variant) {
                        const newQty = variant.quantity - item.qty;
                        if (newQty <= 0) {
                            await supabaseClient.from('product_variants').delete().eq('id', variant.id);
                        } else {
                            await supabaseClient.from('product_variants').update({ quantity: newQty }).eq('id', variant.id);
                        }
                    }
                }
            }

            for (const item of state.cart) {
                const { data: remainingVars } = await supabaseClient.from('product_variants').select('id').eq('product_id', item.productId);
                if (!remainingVars || remainingVars.length === 0) {
                    await supabaseClient.from('products').delete().eq('id', item.productId);
                }
            }

            state.cart = [];
            localStorage.removeItem('reflex_cart');
            await fetchProducts();
            await fetchOrders();
            switchTab('orders');
            showToast('Заказ успешно оформлен!');
        }

        async function cancelOrder(orderId) {
            showConfirm('Отмена заказа', 'Вы действительно хотите отменить этот заказ? Товары вернутся в корзину и на склад.', async () => {
                const order = (state.orders || []).find(o => String(o.id) === String(orderId));
                if (!order) return;

                for (const item of (order.order_items || [])) {
                    let product = (state.products || []).find(p => p.id === item.product_id);
                    if (!product) {
                        product = (state.products || []).find(p => p.name.trim().toLowerCase() === item.product_name.trim().toLowerCase());
                    }

                    let targetVariantId;
                    let targetProductId;

                    if (product) {
                        targetProductId = product.id;
                        const variant = (product.product_variants || []).find(v => v.id === item.variant_id || v.value.trim().toLowerCase() === item.variant_name.trim().toLowerCase());
                        if (variant) {
                            targetVariantId = variant.id;
                            await supabaseClient.from('product_variants').update({ quantity: variant.quantity + item.quantity }).eq('id', variant.id);
                        } else {
                            const { data: newVar } = await supabaseClient.from('product_variants').insert({
                                product_id: product.id,
                                type: product.category === 'железо' ? 'color' : 'flavor',
                                value: item.variant_name,
                                quantity: item.quantity
                            }).select().single();
                            if (newVar) {
                                targetVariantId = newVar.id;
                            }
                        }
                    } else {
                        const { data: newProd } = await supabaseClient.from('products').insert({
                            name: item.product_name,
                            category: 'жидкость',
                            subcategory: 'Восстановленный',
                            retail_price: item.price,
                            wholesale_price: item.wholesale_price || 0,
                            is_featured: true
                        }).select().single();

                        if (newProd) {
                            targetProductId = newProd.id;
                            const { data: newVar } = await supabaseClient.from('product_variants').insert({
                                product_id: newProd.id,
                                type: 'flavor',
                                value: item.variant_name,
                                quantity: item.quantity
                            }).select().single();
                            if (newVar) targetVariantId = newVar.id;
                        }
                    }

                    const existingCartIndex = state.cart.findIndex(ci => ci.productId === targetProductId && ci.variantId === targetVariantId);
                    if (existingCartIndex > -1) {
                        state.cart[existingCartIndex].qty += item.quantity;
                    } else {
                        state.cart.push({
                            productId: targetProductId,
                            variantId: targetVariantId,
                            name: item.product_name,
                            variantName: item.variant_name,
                            price: item.price,
                            wholesalePrice: item.wholesale_price || 0,
                            qty: item.quantity,
                            maxQty: 99
                        });
                    }
                }

                localStorage.setItem('reflex_cart', JSON.stringify(state.cart));
                await supabaseClient.from('orders').delete().eq('id', orderId);
                await fetchProducts();
                await fetchOrders();
                render();
                showToast('Заказ отменен, товары возвращены');
            });
        }

        async function completeOrder(orderId) {
            await supabaseClient.from('orders').update({ status: 'completed' }).eq('id', orderId);
            await fetchOrders();
            render();
            showToast('Заказ отмечен как выполненный');
        }

        async function deleteCompletedOrder(orderId) {
            showConfirm('Удаление', 'Скрыть этот заказ из истории? Статистика и выручка по нему сохранятся.', async () => {
                await supabaseClient.from('orders').update({ status: 'archived' }).eq('id', orderId);
                await fetchOrders();
                render();
                showToast('Заказ скрыт из списка');
            });
        }

        function toggleAdminMenu() {
            const dropdown = document.getElementById('admin-dropdown');
            if (dropdown) dropdown.classList.toggle('hidden');
        }

        function openAdminLoginModal() {
            toggleAdminMenu();
            openModal('modal-admin-login');
        }

        async function submitAdminLogin() {
            const pass = document.getElementById('admin-pass-input').value;
            const { data } = await supabaseClient.from('settings').select('value').eq('key', 'admin_password').single();
            
            if (data && data.value === pass) {
                state.role = 'admin';
                localStorage.setItem('reflex_role', 'admin');
                state.lastKnownAdminPass = data.value;
                localStorage.setItem('reflex_admin_pass_cache', data.value);

                closeModal('modal-admin-login');
                document.getElementById('admin-pass-input').value = '';
                render();
                showToast('Успешный вход в админку!');
            } else {
                showToast('Неверный пароль!', 'error');
            }
        }

        async function logoutAdmin() {
            state.role = 'user';
            localStorage.setItem('reflex_role', 'user');
            state.lastKnownAdminPass = '';
            localStorage.removeItem('reflex_admin_pass_cache');
            toggleAdminMenu();
            render();
            showToast('Вы вышли из режима администратора');
        }

        async function submitChangeAdminPassword() {
            const newPass = document.getElementById('new-admin-pass').value.trim();
            if (!newPass) return;

            const { error } = await supabaseClient.from('settings').update({ value: newPass }).eq('key', 'admin_password');
            if (!error) {
                showToast('Пароль успешно изменен! Все открытые сессии админки сброшены.');
                closeModal('modal-change-password');
                document.getElementById('new-admin-pass').value = '';
                
                state.role = 'user';
                localStorage.setItem('reflex_role', 'user');
                state.lastKnownAdminPass = '';
                localStorage.removeItem('reflex_admin_pass_cache');
                render();
            } else {
                showToast('Ошибка: ' + error.message, 'error');
            }
        }

        function updateVariantLabel() {
            const cat = document.getElementById('p-category').value;
            const label = document.getElementById('variants-label');
            if (label) label.textContent = cat === 'железо' ? 'Цвета и количество' : 'Вкусы и количество';
        }

        function openProductModal(product = null) {
            document.getElementById('edit-product-id').value = product ? product.id : '';
            document.getElementById('p-name').value = product ? product.name : '';
            document.getElementById('p-category').value = product ? product.category : 'жидкость';
            document.getElementById('p-subcategory').value = product ? product.subcategory : '';
            document.getElementById('p-retail').value = product ? (product.old_price && product.old_price > product.retail_price ? product.old_price : product.retail_price) : '';
            document.getElementById('p-wholesale').value = product ? product.wholesale_price : '';
            
            const imgVal = product ? product.image_url : '';
            document.getElementById('p-image').value = imgVal;
            const previewContainer = document.getElementById('image-preview-container');
            const preview = document.getElementById('image-preview');
            
            if (imgVal) {
                preview.src = imgVal;
                previewContainer.classList.remove('hidden');
            } else {
                previewContainer.classList.add('hidden');
                const fileInput = document.getElementById('p-image-file');
                if (fileInput) fileInput.value = '';
            }

            document.getElementById('p-featured').checked = product ? product.is_featured : true;

            updateVariantLabel();
            const container = document.getElementById('variants-rows');
            container.innerHTML = '';

            if (product && product.product_variants) {
                product.product_variants.forEach(v => {
                    addVariantRow(v.value, v.quantity);
                });
            } else {
                addVariantRow('', '');
            }

            openModal('modal-product-form');
        }

        function addVariantRow(val = '', qty = '') {
            const container = document.getElementById('variants-rows');
            if (!container) return;
            const row = document.createElement('div');
            row.className = 'flex space-x-2 items-center variant-row';
            row.innerHTML = `
                <input type="text" placeholder="Название (вкус/цвет)" value="${val}" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-accent v-name">
                <input type="number" placeholder="Кол-во" value="${qty}" class="w-20 bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-accent v-qty">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            `;
            container.appendChild(row);
            lucide.createIcons();
        }

        async function saveProduct() {
            const id = document.getElementById('edit-product-id').value;
            const name = document.getElementById('p-name').value.trim();
            const category = document.getElementById('p-category').value;
            const subcategory = document.getElementById('p-subcategory').value.trim();
            const retail_price = Number(document.getElementById('p-retail').value);
            const wholesale_price = Number(document.getElementById('p-wholesale').value);
            const image_url = document.getElementById('p-image').value.trim();
            const is_featured = document.getElementById('p-featured').checked;

            if (!name || !retail_price) {
                showToast('Заполните обязательные поля!', 'error');
                return;
            }

            const variantRows = document.querySelectorAll('.variant-row');
            let variantsMap = {};
            variantRows.forEach(row => {
                const vName = row.querySelector('.v-name').value.trim();
                const vQty = Number(row.querySelector('.v-qty').value);
                if (vName) {
                    const key = vName.toLowerCase();
                    if (!variantsMap[key]) {
                        variantsMap[key] = {
                            type: category === 'железо' ? 'color' : 'flavor',
                            value: vName,
                            quantity: vQty || 0
                        };
                    } else {
                        variantsMap[key].quantity += (vQty || 0);
                    }
                }
            });

            const variantsData = Object.values(variantsMap);

            if (variantsData.length === 0) {
                showToast('Добавьте хотя бы один вариант (вкус/цвет)!', 'error');
                return;
            }

            let productId = id;
            if (!productId) {
                const existing = (state.products || []).find(p => p.name.trim().toLowerCase() === name.toLowerCase());
                if (existing) {
                    productId = existing.id;
                }
            }

            if (productId) {
                const existingProd = (state.products || []).find(p => p.id == productId);
                let updateData = { name, category, subcategory, retail_price, wholesale_price, image_url, is_featured };
                if (existingProd && existingProd.old_price && existingProd.old_price > existingProd.retail_price) {
                    if (existingProd.old_price === retail_price) {
                        updateData.old_price = null;
                    }
                }

                await supabaseClient.from('products').update(updateData).eq('id', productId);
                await supabaseClient.from('product_variants').delete().eq('product_id', productId);
            } else {
                const { data, error } = await supabaseClient.from('products').insert({ name, category, subcategory, retail_price, wholesale_price, image_url, is_featured }).select().single();
                if (error) { showToast('Ошибка: ' + error.message, 'error'); return; }
                productId = data.id;
            }

            if (variantsData.length > 0) {
                const toInsert = variantsData.map(v => ({ ...v, product_id: productId }));
                await supabaseClient.from('product_variants').insert(toInsert);
            }

            closeModal('modal-product-form');
            await fetchProducts();
            render();
            showToast('Товар успешно сохранен!');
        }

        async function editProduct(productId) {
            const product = (state.products || []).find(p => p.id === productId);
            if (product) openProductModal(product);
        }

        async function deleteProduct(productId) {
            showConfirm('Удаление товара', 'Вы уверены, что хотите удалить этот товар?', async () => {
                await supabaseClient.from('products').delete().eq('id', productId);
                await fetchProducts();
                render();
                showToast('Товар удален');
            });
        }

        function openModal(id) { 
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('hidden'); 
                lucide.createIcons(); 
            }
        }
        function closeModal(id) { 
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden'); 
        }
    </script>
</body>
