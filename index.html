<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLD VAPE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f0f11',
                        cardBg: '#18181b',
                        cardHover: '#27272a',
                        accent: '#7c3aed',
                        accentHover: '#6d28d9',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f0f11; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f0f11; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white">

    <!-- Верхняя шапка -->
    <header class="sticky top-0 z-40 bg-darkBg/85 backdrop-blur-md border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <h1 id="shop-title" class="text-lg font-bold tracking-wide">VLD VAPE</h1>
            <span id="role-badge" class="text-xs px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400">Пользователь</span>
        </div>
        <div class="relative">
            <button onclick="toggleAdminMenu()" class="w-9 h-9 flex items-center justify-center rounded-full bg-zinc-800 hover:bg-zinc-700 transition">
                <i data-lucide="more-vertical" class="w-5 h-5"></i>
            </button>
            <!-- Выпадающее меню -->
            <div id="admin-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-cardBg border border-zinc-700 rounded-xl shadow-xl overflow-hidden z-50">
                <div id="admin-login-menu-item">
                    <button onclick="openAdminLoginModal()" class="w-full text-left px-4 py-3 text-sm hover:bg-zinc-700/50 flex items-center space-x-2">
                        <i data-lucide="shield" class="w-4 h-4 text-accent"></i>
                        <span>Для работников</span>
                    </button>
                </div>
                <div id="admin-logout-btn" class="hidden">
                    <button onclick="logoutAdmin()" class="w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-zinc-700/50 flex items-center space-x-2">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        <span>Выйти из админки</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main id="main-content" class="flex-1 max-w-md w-full mx-auto p-4 pb-28">
        <!-- Динамический контент рендерится через JS -->
    </main>

    <!-- Нижняя навигация -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-darkBg/90 backdrop-blur-md border-t border-zinc-800 px-2 py-2 flex justify-around items-center z-30">
        <!-- Навигация рендерится через JS -->
    </nav>

    <!-- Уведомления (тосты) -->
    <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-[100] flex flex-col space-y-2 w-11/12 max-w-sm pointer-events-none"></div>

    <!-- Модальное окно подтверждения -->
    <div id="modal-confirm" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-zinc-700 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
            <h3 id="confirm-title" class="text-lg font-bold">Подтверждение</h3>
            <p id="confirm-text" class="text-sm text-zinc-400">Вы уверены?</p>
            <div class="flex space-x-2 pt-2">
                <button id="confirm-cancel-btn" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-2.5 rounded-xl text-sm font-medium transition">Отмена</button>
                <button id="confirm-ok-btn" class="flex-1 bg-accent hover:bg-accentHover py-2.5 rounded-xl text-sm font-medium transition text-white">Да</button>
            </div>
        </div>
    </div>

    <!-- Модальные окна -->
    <!-- 1. Вход админа -->
    <div id="modal-admin-login" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-zinc-700 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Вход для работников</h3>
                <button onclick="closeModal('modal-admin-login')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div>
                <input type="password" id="admin-pass-input" placeholder="Введите пароль админа" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-accent" style="color-scheme: dark;">
            </div>
            <button onclick="submitAdminLogin()" class="w-full bg-accent hover:bg-accentHover py-3 rounded-xl font-medium transition">Войти</button>
        </div>
    </div>

    <!-- 2. Выбор вкуса/цвета при добавлении в корзину -->
    <div id="modal-variant-select" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-zinc-700 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 id="variant-modal-title" class="text-lg font-bold">Выберите вариант</h3>
                <button onclick="closeModal('modal-variant-select')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="variant-list-container" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <!-- 3. Добавление / Редактирование товара (Админ) -->
    <div id="modal-product-form" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-zinc-700 w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 id="product-form-title" class="text-lg font-bold">Добавить товар</h3>
                <button onclick="closeModal('modal-product-form')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <input type="hidden" id="edit-product-id">
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-zinc-400 mb-1 block">Название</label>
                    <input type="text" id="p-name" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-zinc-400 mb-1 block">Категория</label>
                        <select id="p-category" onchange="updateVariantLabel()" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-accent">
                            <option value="жидкость">Жидкость</option>
                            <option value="железо">Железо</option>
                            <option value="одноразки">Одноразки</option>
                            <option value="снюс/пластинки">Снюс/пластинки</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 mb-1 block">Подкатегория (Бренд)</label>
                        <input type="text" id="p-subcategory" placeholder="например, Мутанты" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-accent">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-zinc-400 mb-1 block">Цена розница (₽)</label>
                        <input type="number" id="p-retail" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 mb-1 block">Цена опт (₽)</label>
                        <input type="number" id="p-wholesale" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-accent">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-zinc-400 mb-1 block">Фото с устройства</label>
                    <input type="file" id="p-image-file" accept="image/*" onchange="handleImageUpload(event)" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-zinc-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-accent file:text-white hover:file:bg-accentHover">
                    <input type="hidden" id="p-image">
                    <div id="image-preview-container" class="mt-2 hidden">
                        <img id="image-preview" class="w-20 h-20 object-cover rounded-xl border border-zinc-700">
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="p-featured" class="w-4 h-4 accent-accent" checked>
                    <label class="text-sm text-zinc-300">Показывать на Главной</label>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label id="variants-label" class="text-xs text-zinc-400">Вкусы и количество</label>
                        <button type="button" onclick="addVariantRow()" class="text-xs text-accent hover:underline flex items-center space-x-1"><i data-lucide="plus" class="w-3 h-3"></i><span>Добавить</span></button>
                    </div>
                    <div id="variants-rows" class="space-y-2"></div>
                </div>
            </div>
            <button onclick="saveProduct()" class="w-full bg-accent hover:bg-accentHover py-3 rounded-xl font-medium transition">Сохранить товар</button>
        </div>
    </div>

    <!-- 5. Управление скидкой/акцией товара -->
    <div id="modal-discount-form" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-zinc-700 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Управление скидкой</h3>
                <button onclick="closeModal('modal-discount-form')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <input type="hidden" id="discount-product-id">
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-zinc-400 mb-1 block">Текущая (старая) розничная цена</label>
                    <div id="discount-old-price-text" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-400 select-none">0 ₽</div>
                </div>
                <div>
                    <label class="text-xs text-zinc-400 mb-1 block">Новая акционная цена (₽)</label>
                    <input type="number" id="discount-new-price" placeholder="Оставьте пустым для отмены акции" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
                </div>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="saveDiscount(true)" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-2.5 rounded-xl text-xs font-medium transition text-red-400">Убрать акцию</button>
                <button onclick="saveDiscount(false)" class="flex-1 bg-accent hover:bg-accentHover py-2.5 rounded-xl text-xs font-medium transition text-white">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- 4. Изменение пароля админа -->
    <div id="modal-change-password" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-zinc-700 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Сменить пароль админа</h3>
                <button onclick="closeModal('modal-change-password')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <input type="password" id="new-admin-pass" placeholder="Новый пароль" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-accent">
            <button onclick="submitChangeAdminPassword()" class="w-full bg-accent hover:bg-accentHover py-3 rounded-xl font-medium transition">Обновить пароль</button>
        </div>
    </div>

    <!-- Скрипт приложения -->
    <script>
        // Инициализация Supabase
        const SUPABASE_URL = 'https://ehrzjvuuvodudlelazhe.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_5Lj-BMZYANimr2UG2ZCqgQ_MEi6tOHp';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Состояние приложения
        let state = {
            role: localStorage.getItem('reflex_role') || 'user', 
            activeTab: localStorage.getItem('reflex_role') === 'admin' ? 'admin_home' : 'home', 
            user: localStorage.getItem('reflex_username') || '',
            phone: localStorage.getItem('reflex_phone') || '',
            userId: localStorage.getItem('reflex_user_id') || null,
            isProfileEditing: false, 
            cart: JSON.parse(localStorage.getItem('reflex_cart') || '[]'),
            products: [],
            orders: [],
            adminStatsFilter: 'all', 
            adminHomeSubTab: 'stats',
            catalogCategory: 'жидкость',
            catalogSubcategory: 'all',
            searchQuery: '',
            chartInstance: null,
            lastKnownAdminPass: localStorage.getItem('reflex_admin_pass_cache') || ''
        };

        // Кастомные уведомления
        function showToast(message, type = 'success') {
            try {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `pointer-events-auto px-4 py-3 rounded-2xl text-sm font-medium shadow-xl border flex items-center justify-between transition-all duration-300 transform translate-y-2 opacity-0 ${
                    type === 'error' ? 'bg-red-950/90 border-red-800 text-red-200' : 'bg-cardBg border-zinc-700 text-zinc-100'
                }`;
                toast.innerHTML = `<span>${message}</span>`;
                container.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.remove('translate-y-2', 'opacity-0');
                }, 10);

                setTimeout(() => {
                    toast.classList.add('translate-y-2', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            } catch (e) {
                console.error(e);
            }
        }

        // Кастомное подтверждение
        function showConfirm(title, text, onConfirm) {
            const modal = document.getElementById('modal-confirm');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-text').textContent = text;
            
            const okBtn = document.getElementById('confirm-ok-btn');
            const cancelBtn = document.getElementById('confirm-cancel-btn');
            
            modal.classList.remove('hidden');
            lucide.createIcons();

            const handleOk = () => {
                modal.classList.add('hidden');
                cleanup();
                onConfirm();
            };

            const handleCancel = () => {
                modal.classList.add('hidden');
                cleanup();
            };

            const cleanup = () => {
                okBtn.removeEventListener('click', handleOk);
                cancelBtn.removeEventListener('click', handleCancel);
            };

            okBtn.addEventListener('click', handleOk);
            cancelBtn.addEventListener('click', handleCancel);
        }

        // Проверка изменения пароля админа в базе данных
        async function checkAdminPasswordValidity() {
            if (state.role !== 'admin') return;
            try {
                const { data, error } = await supabaseClient.from('settings').select('value').eq('key', 'admin_password').single();
                if (!error && data) {
                    if (state.lastKnownAdminPass && state.lastKnownAdminPass !== data.value) {
                        forceDemoteToUser('Пароль администратора был изменен. Требуется повторный вход.');
                    } else {
                        state.lastKnownAdminPass = data.value;
                        localStorage.setItem('reflex_admin_pass_cache', data.value);
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function forceDemoteToUser(message) {
            state.role = 'user';
            localStorage.setItem('reflex_role', 'user');
            state.lastKnownAdminPass = '';
            localStorage.removeItem('reflex_admin_pass_cache');
            render();
            showToast(message, 'error');
        }

        // Полный сброс системы в 0
        async function resetSystemToZero() {
            showConfirm('Полный сброс сайта в 0', 'Вы уверены? Все товары, варианты, заказы и корзины будут полностью удалены. Пароль администратора сохранится.', async () => {
                try {
                    await supabaseClient.from('order_items').delete().not('id', 'is', null);
                    await supabaseClient.from('orders').delete().not('id', 'is', null);
                    await supabaseClient.from('product_variants').delete().not('id', 'is', null);
                    await supabaseClient.from('products').delete().not('id', 'is', null);

                    state.cart = [];
                    localStorage.removeItem('reflex_cart');
                    state.searchQuery = '';
                    
                    await fetchProducts();
                    await fetchOrders();
                    render();
                    showToast('Сайт полностью сброшен в начальное состояние!');
                } catch (e) {
                    console.error(e);
                    showToast('Ошибка при сбросе системы: ' + e.message, 'error');
                }
            });
        }

        // Точечная проверка остатков
        function validateCartStock() {
            if (!state.cart || state.cart.length === 0) return;

            let removedFlavors = false;
            const updatedCart = [];

            for (const item of state.cart) {
                const product = (state.products || []).find(p => p.id === item.productId);
                if (!product) {
                    removedFlavors = true;
                    continue;
                }

                const variant = (product.product_variants || []).find(v => v.id === item.variantId);
                if (!variant || variant.quantity <= 0) {
                    removedFlavors = true;
                    continue;
                }

                if (item.qty > variant.quantity) {
                    item.qty = variant.quantity;
                }

                item.maxQty = variant.quantity;
                updatedCart.push(item);
            }

            if (removedFlavors) {
                showToast('Некоторые вкусы или товары из вашей корзины закончились и были удалены', 'error');
            }

            state.cart = updatedCart;
            localStorage.setItem('reflex_cart', JSON.stringify(state.cart));
        }

        // Запуск при загрузке
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                if (window.Notification && Notification.permission !== 'granted') {
                    Notification.requestPermission();
                }

                if (state.role === 'admin' && !state.lastKnownAdminPass) {
                    const { data } = await supabaseClient.from('settings').select('value').eq('key', 'admin_password').single();
                    if (data) {
                        state.lastKnownAdminPass = data.value;
                        localStorage.setItem('reflex_admin_pass_cache', data.value);
                    }
                }

                await fetchProducts();
                await fetchOrders();
                validateCartStock();
                render();

                supabaseClient
                    .channel('settings-changes')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'settings' }, payload => {
                        if (payload.new && payload.new.key === 'admin_password') {
                            if (state.role === 'admin') {
                                if (state.lastKnownAdminPass && state.lastKnownAdminPass !== payload.new.value) {
                                    forceDemoteToUser('Пароль администратора был изменен. Требуется повторный вход.');
                                }
                            }
                        }
                    })
                    .subscribe();

                setInterval(async () => {
                    await checkAdminPasswordValidity();

                    const prevInProgress = (state.orders || []).filter(o => o.status === 'in_progress').length;
                    await fetchOrders();
                    const newInProgress = (state.orders || []).filter(o => o.status === 'in_progress').length;
                    
                    if (newInProgress > prevInProgress && state.role === 'admin') {
                        showToast('🔔 Поступил новый заказ!', 'success');
                        if (window.Notification && Notification.permission === 'granted') {
                            new Notification('VLD VAPE', { body: 'Поступил новый заказ в обработку!' });
                        }
                        if (state.activeTab === 'admin_orders' || state.activeTab === 'admin_home') {
                            render();
                        }
                    }
                }, 10000);

            } catch (e) {
                console.error(e);
                showToast('Ошибка инициализации приложения', 'error');
            }
        });

        async function fetchProducts() {
            try {
                const { data, error } = await supabaseClient.from('products').select('*, product_variants(*)');
                if (!error && data) {
                    const map = {};
                    for (const p of data) {
                        const key = p.name.trim().toLowerCase();
                        if (!map[key]) {
                            const varMap = {};
                            if (p.product_variants) {
                                for (const v of p.product_variants) {
                                    const vKey = v.value.trim().toLowerCase();
                                    if (!varMap[vKey]) {
                                        varMap[vKey] = { ...v };
                                    } else {
                                        varMap[vKey].quantity += Number(v.quantity || 0);
                                        await supabaseClient.from('product_variants').delete().eq('id', v.id);
                                    }
                                }
                            }
                            map[key] = { ...p, product_variants: Object.values(varMap) };
                        } else {
                            for (const v of (p.product_variants || [])) {
                                const vKey = v.value.trim().toLowerCase();
                                const existingVar = map[key].product_variants.find(item => item.value.trim().toLowerCase() === vKey);
                                if (existingVar) {
                                    existingVar.quantity += Number(v.quantity || 0);
                                    await supabaseClient.from('product_variants').delete().eq('id', v.id);
                                } else {
                                    await supabaseClient.from('product_variants').update({ product_id: map[key].id }).eq('id', v.id);
                                    map[key].product_variants.push(v);
                                }
                            }
                            await supabaseClient.from('products').delete().eq('id', p.id);
                        }
                    }
                    
                    for (const mainKey of Object.keys(map)) {
                        const prod = map[mainKey];
                        if (!prod.product_variants || prod.product_variants.length === 0) {
                            await supabaseClient.from('products').delete().eq('id', prod.id);
                            delete map[mainKey];
                        }
                    }
                    state.products = Object.values(map);
                    validateCartStock();
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchOrders() {
            try {
                const { data, error } = await supabaseClient.from('orders').select('*, order_items(*)');
                if (!error && data) state.orders = data;
            } catch (e) {
                console.error(e);
            }
        }

        function render() {
            try {
                const roleBadge = document.getElementById('role-badge');
                const adminLogoutBtn = document.getElementById('admin-logout-btn');
                const adminLoginMenuItem = document.getElementById('admin-login-menu-item');
                
                if (state.role === 'admin') {
                    roleBadge.textContent = 'Админ';
                    roleBadge.className = 'text-xs px-2 py-0.5 rounded-full bg-accent text-white font-medium';
                    if (adminLogoutBtn) adminLogoutBtn.classList.remove('hidden');
                    if (adminLoginMenuItem) adminLoginMenuItem.classList.add('hidden');
                    if (!state.activeTab.startsWith('admin_')) state.activeTab = 'admin_home';
                } else {
                    roleBadge.textContent = 'Пользователь';
                    roleBadge.className = 'text-xs px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400';
                    if (adminLogoutBtn) adminLogoutBtn.classList.add('hidden');
                    if (adminLoginMenuItem) adminLoginMenuItem.classList.remove('hidden');
                    if (state.activeTab.startsWith('admin_')) state.activeTab = 'home';
                }

                renderNav();
                renderMainContent();
                lucide.createIcons();
            } catch (e) {
                console.error(e);
                showToast('Ошибка отображения интерфейса', 'error');
            }
        }

        function renderNav() {
            const nav = document.getElementById('bottom-nav');
            if (state.role === 'user') {
                nav.innerHTML = `
                    <button onclick="switchTab('home')" class="flex flex-col items-center py-1 px-3 ${state.activeTab === 'home' ? 'text-accent' : 'text-zinc-400'}">
                        <i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] mt-1">Главная</span>
                    </button>
                    <button onclick="switchTab('catalog')" class="flex flex-col items-center py-1 px-3 ${state.activeTab === 'catalog' ? 'text-accent' : 'text-zinc-400'}">
                        <i data-lucide="grid" class="w-5 h-5"></i><span class="text-[10px] mt-1">Каталог</span>
                    </button>
                    <button onclick="switchTab('cart')" class="flex flex-col items-center py-1 px-3 relative ${state.activeTab === 'cart' ? 'text-accent' : 'text-zinc-400'}">
                        <i data-lucide="shopping-cart" class="w-5 h-5"></i><span class="text-[10px] mt-1">Корзина</span>
                        ${state.cart.length > 0 ? `<span class="absolute top-0 right-3 bg-accent text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">${state.cart.reduce((a,c)=>a+c.qty,0)}</span>` : ''}
                    </button>
                    <button onclick="switchTab('orders')" class="flex flex-col items-center py-1 px-3 ${state.activeTab === 'orders' ? 'text-accent' : 'text-zinc-400'}">
                        <i data-lucide="package" class="w-5 h-5"></i><span class="text-[10px] mt-1">Заказы</span>
                    </button>
                    <button onclick="switchTab('profile')" class="flex flex-col items-center py-1 px-3 ${state.activeTab === 'profile' ? 'text-accent' : 'text-zinc-400'}">
                        <i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] mt-1">Профиль</span>
                    </button>
                `;
            } else {
                const inProgressCount = (state.orders || []).filter(o => o.status === 'in_progress').length;
                nav.innerHTML = `
                    <button onclick="switchTab('admin_home')" class="flex flex-col items-center py-1 px-2 ${state.activeTab === 'admin_home' ? 'text-accent' : 'text-zinc-400'}">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[10px] mt-1">Главная</span>
                    </button>
                    <button onclick="switchTab('admin_catalog')" class="flex flex-col items-center py-1 px-2 ${state.activeTab === 'admin_catalog' ? 'text-accent' : 'text-zinc-400'}">
                        <i data-lucide="grid" class="w-5 h-5"></i><span class="text-[10px] mt-1">Каталог</span>
                    </button>
                    <button onclick="switchTab('admin_orders')" class="flex flex-col items-center py-1 px-2 relative ${state.activeTab === 'admin_orders' ? 'text-accent' : 'text-zinc-400'}">
                        <i data-lucide="clipboard-list" class="w-5 h-5"></i><span class="text-[10px] mt-1">Заказы</span>
                        ${inProgressCount > 0 ? `<span class="absolute top-0 right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">${inProgressCount}</span>` : ''}
                    </button>
                    <button onclick="switchTab('admin_products')" class="flex flex-col items-center py-1 px-2 ${state.activeTab === 'admin_products' ? 'text-accent' : 'text-zinc-400'}">
                        <i data-lucide="shopping-bag" class="w-5 h-5"></i><span class="text-[10px] mt-1">Товары</span>
                    </button>
                    <button onclick="switchTab('admin_settings')" class="flex flex-col items-center py-1 px-2 ${state.activeTab === 'admin_settings' ? 'text-accent' : 'text-zinc-400'}">
                        <i data-lucide="settings" class="w-5 h-5"></i><span class="text-[10px] mt-1">Ещё</span>
                    </button>
                `;
            }
        }

        function switchTab(tab) {
            state.activeTab = tab;
            render();
            window.scrollTo(0, 0);
        }

        function renderMainContent() {
            const main = document.getElementById('main-content');
            if (!main) return;
            main.innerHTML = '';

            switch(state.activeTab) {
                case 'home': renderUserHome(main); break;
                case 'catalog': renderUserCatalog(main); break;
                case 'cart': renderUserCart(main); break;
                case 'orders': renderUserOrders(main); break;
                case 'profile': renderUserProfile(main); break;
                case 'admin_home': renderAdminHome(main); break;
                case 'admin_catalog': renderUserCatalog(main); break;
                case 'admin_orders': renderAdminOrders(main); break;
                case 'admin_products': renderAdminProducts(main); break;
                case 'admin_settings': renderAdminSettings(main); break;
            }
            lucide.createIcons();
        }

        function renderUserHome(container) {
            const featured = (state.products || []).filter(p => {
                if (!p.is_featured) return false;
                const hasStock = p.product_variants && p.product_variants.some(v => v.quantity > 0);
                return hasStock;
            });

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-gradient-to-r from-accent/30 via-cardBg to-accent/20 border border-zinc-700/60 rounded-2xl p-4 shadow-xl flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-accent flex items-center justify-center text-white shrink-0 shadow-lg shadow-accent/40">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h2 class="text-sm font-bold tracking-wide text-zinc-100">Добро пожаловать в VLD VAPE!</h2>
                            <p class="text-xs text-zinc-400 mt-0.5">Лучший выбор жидкостей, устройств и всего остального</p>
                        </div>
                    </div>

                    <div class="relative">
                        <input type="text" oninput="state.searchQuery=this.value; renderUserHomeSearch(this.value);" placeholder="Поиск товаров..." value="${state.searchQuery}" class="w-full bg-cardBg border border-zinc-700 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-accent">
                        <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-3.5"></i>
                    </div>
                    <div id="home-products-grid" class="grid grid-cols-2 gap-3">
                        ${featured.length === 0 ? '<p class="col-span-2 text-center text-zinc-500 py-10">Нет товаров на главной</p>' : featured.map(p => renderProductCard(p)).join('')}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderUserHomeSearch(query) {
            const grid = document.getElementById('home-products-grid');
            if (!grid) return;
            const filtered = (state.products || []).filter(p => {
                if (!p.is_featured) return false;
                const hasStock = p.product_variants && p.product_variants.some(v => v.quantity > 0);
                if (!hasStock) return false;
                return p.name.toLowerCase().includes(query.toLowerCase()) || (p.subcategory && p.subcategory.toLowerCase().includes(query.toLowerCase()));
            });
            grid.innerHTML = filtered.length === 0 ? '<p class="col-span-2 text-center text-zinc-500 py-10">Ничего не найдено</p>' : filtered.map(p => renderProductCard(p)).join('');
            lucide.createIcons();
        }

        function renderProductCard(p) {
            const hasDiscount = p.old_price && p.old_price > p.retail_price;
            return `
                <div class="bg-cardBg border border-zinc-800 rounded-2xl p-3 flex flex-col justify-between hover:border-zinc-700 transition relative">
                    ${hasDiscount ? '<span class="absolute top-2 right-2 bg-red-500/90 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">АКЦИЯ</span>' : ''}
                    <div>
                        <img src="${p.image_url || 'https://via.placeholder.com/150'}" alt="${p.name}" class="w-full h-36 object-cover rounded-xl mb-3">
                        <h4 class="font-semibold text-sm line-clamp-1">${p.name}</h4>
                        <p class="text-xs text-zinc-400">${p.subcategory || ''}</p>
                    </div>
                    <div class="flex items-center justify-between mt-3">
                        <div class="flex flex-col">
                            ${hasDiscount ? `<span class="text-[11px] text-zinc-500 line-through">${p.old_price} ₽</span>` : ''}
                            <span class="font-bold text-sm text-accent">${p.retail_price} ₽</span>
                        </div>
                        <button onclick="openVariantModal(${p.id})" class="w-8 h-8 rounded-full bg-accent hover:bg-accentHover flex items-center justify-center text-white transition">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function getCatalogCardsHTML() {
            const filteredProducts = (state.products || []).filter(p => {
                if (p.category !== state.catalogCategory) return false;
                const hasStock = p.product_variants && p.product_variants.some(v => v.quantity > 0);
                if (!hasStock) return false;
                if (state.catalogSubcategory !== 'all' && p.subcategory !== state.catalogSubcategory) return false;
                return true;
            });
            
            let variantCards = [];
            const query = (state.searchQuery || '').toLowerCase();

            filteredProducts.forEach(p => {
                if (p.product_variants && p.product_variants.length > 0) {
                    p.product_variants.forEach(v => {
                        if (v.quantity > 0) {
                            const matchesSearch = !query || 
                                p.name.toLowerCase().includes(query) || 
                                (p.subcategory && p.subcategory.toLowerCase().includes(query)) || 
                                v.value.toLowerCase().includes(query);
                            
                            if (matchesSearch) {
                                variantCards.push({ product: p, variant: v });
                            }
                        }
                    });
                }
            });

            if (variantCards.length === 0) {
                return '<p class="col-span-2 text-center text-zinc-500 py-10">Товары не найдены</p>';
            }

            return variantCards.map(item => {
                const p = item.product;
                const hasDiscount = p.old_price && p.old_price > p.retail_price;
                return `
                    <div class="bg-cardBg border border-zinc-800 rounded-2xl p-3 flex flex-col justify-between hover:border-zinc-700 transition relative">
                        ${hasDiscount ? '<span class="absolute top-2 right-2 bg-red-500/90 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">АКЦИЯ</span>' : ''}
                        <div>
                            <img src="${p.image_url || 'https://via.placeholder.com/150'}" alt="${p.name}" class="w-full h-36 object-cover rounded-xl mb-3">
                            <h4 class="font-semibold text-sm line-clamp-1">${p.name}</h4>
                            <p class="text-xs text-zinc-400">${p.subcategory || ''}</p>
                            <p class="text-xs font-medium text-purple-300 mt-1">${item.variant.type === 'flavor' ? 'Вкус' : 'Цвет'}: ${item.variant.value}</p>
                        </div>
                        <div class="flex items-center justify-between mt-3">
                            <div class="flex flex-col">
                                ${hasDiscount ? `<span class="text-[11px] text-zinc-500 line-through">${p.old_price} ₽</span>` : ''}
                                <span class="font-bold text-sm text-accent">${p.retail_price} ₽</span>
                            </div>
                            <button onclick="addToCart(${p.id}, ${item.variant.id})" class="w-8 h-8 rounded-full bg-accent hover:bg-accentHover flex items-center justify-center text-white transition">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderUserCatalog(container) {
            const categories = ['жидкость', 'железо', 'одноразки', 'снюс/пластинки'];
            if (!categories.includes(state.catalogCategory)) state.catalogCategory = categories[0];

            const currentCategoryProducts = (state.products || []).filter(p => {
                if (p.category !== state.catalogCategory) return false;
                const hasStock = p.product_variants && p.product_variants.some(v => v.quantity > 0);
                return hasStock;
            });
            
            const subcategories = ['all', ...new Set(currentCategoryProducts.map(p => p.subcategory).filter(Boolean))];
            if (!subcategories.includes(state.catalogSubcategory)) state.catalogSubcategory = 'all';

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="relative">
                        <input type="text" id="catalog-search-input" oninput="state.searchQuery=this.value; updateCatalogGrid();" placeholder="Поиск в каталоге..." value="${state.searchQuery}" class="w-full bg-cardBg border border-zinc-700 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-accent">
                        <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-3.5"></i>
                    </div>
                    <div class="flex space-x-2 overflow-x-auto pb-1">
                        ${categories.map(cat => `
                            <button onclick="state.catalogCategory='${cat}'; state.catalogSubcategory='all'; state.searchQuery=''; render();" class="px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap transition ${state.catalogCategory === cat ? 'bg-accent text-white' : 'bg-cardBg text-zinc-400 hover:bg-zinc-800'}">
                                ${cat.charAt(0).toUpperCase() + cat.slice(1)}
                            </button>
                        `).join('')}
                    </div>
                    ${subcategories.length > 1 ? `
                        <div class="flex space-x-1.5 overflow-x-auto pb-1 text-xs">
                            ${subcategories.map(sub => `
                                <button onclick="state.catalogSubcategory='${sub}'; updateCatalogGrid();" class="px-3 py-1.5 rounded-lg whitespace-nowrap transition border ${state.catalogSubcategory === sub ? 'bg-zinc-800 border-accent text-white font-medium' : 'bg-zinc-900/50 border-zinc-800 text-zinc-400 hover:bg-zinc-800'}">
                                    ${sub === 'all' ? 'Все бренды' : sub}
                                </button>
                            `).join('')}
                        </div>
                    ` : ''}
                    <div id="catalog-products-grid" class="grid grid-cols-2 gap-3">
                        ${getCatalogCardsHTML()}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function updateCatalogGrid() {
            const grid = document.getElementById('catalog-products-grid');
            if (grid) {
                grid.innerHTML = getCatalogCardsHTML();
                lucide.createIcons();
            }
        }

        function renderUserCart(container) {
            const total = state.cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            container.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-lg font-bold">Корзина</h2>
                    <div class="space-y-2 max-h-[35vh] overflow-y-auto">
                        ${state.cart.length === 0 ? '<p class="text-center text-zinc-500 py-6">Корзина пуста</p>' : state.cart.map((item, idx) => `
                            <div class="bg-cardBg border border-zinc-800 rounded-2xl p-3 flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <img src="${item.image || 'https://via.placeholder.com/150'}" class="w-12 h-12 object-cover rounded-xl">
                                    <div>
                                        <h4 class="font-semibold text-sm">${item.name}</h4>
                                        <p class="text-xs text-zinc-400">${item.variantName} | ${item.price} ₽</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <button onclick="updateCartQty(${idx}, -1)" class="w-7 h-7 bg-zinc-800 hover:bg-zinc-700 rounded-lg flex items-center justify-center text-sm">-</button>
                                    <span class="text-sm font-medium w-6 text-center">${item.qty}</span>
                                    <button onclick="updateCartQty(${idx}, 1)" class="w-7 h-7 bg-zinc-800 hover:bg-zinc-700 rounded-lg flex items-center justify-center text-sm">+</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    ${state.cart.length > 0 ? `
                        <div class="border-t border-zinc-800 pt-3 space-y-3">
                            <div class="bg-cardBg border border-zinc-700/60 rounded-2xl p-3.5 space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-semibold text-zinc-400 uppercase tracking-wide">Проверка данных для заказа</span>
                                    <button onclick="switchTab('profile')" class="text-xs text-accent hover:underline flex items-center space-x-1">
                                        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i><span>Изменить</span>
                                    </button>
                                </div>
                                <div class="grid grid-cols-2 gap-2 text-xs pt-1">
                                    <div class="bg-zinc-900/60 p-2 rounded-xl border border-zinc-800">
                                        <span class="text-zinc-500 block text-[10px]">Юз (username):</span>
                                        <span class="font-medium text-zinc-200">${state.user || 'Не указан'}</span>
                                    </div>
                                    <div class="bg-zinc-900/60 p-2 rounded-xl border border-zinc-800">
                                        <span class="text-zinc-500 block text-[10px]">Телефон:</span>
                                        <span class="font-medium text-zinc-200">${state.phone || 'Не указан'}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="flex justify-between text-base font-bold">
                                <span>Итого:</span>
                                <span class="text-accent">${total} ₽</span>
                            </div>
                            <button onclick="checkoutOrder()" class="w-full bg-accent hover:bg-accentHover py-3 rounded-xl font-medium transition text-white">Оформить заказ</button>
                        </div>
                    ` : ''}
                </div>
            `;
            lucide.createIcons();
        }

        function renderUserOrders(container) {
            const myOrders = state.user ? (state.orders || []).filter(o => o.status !== 'archived' && o.username && o.username.toLowerCase() === state.user.toLowerCase()) : [];
            const inProgress = myOrders.filter(o => o.status === 'in_progress');
            const completed = myOrders.filter(o => o.status === 'completed');

            container.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-lg font-bold">Мои заказы</h2>
                    ${!state.user ? '<p class="text-center text-zinc-500 py-6">Укажите свой юз в профиле, чтобы видеть заказы</p>' : ''}
                    
                    <div class="space-y-3">
                        <h3 class="text-sm font-semibold text-zinc-400">В работе (${inProgress.length})</h3>
                        ${inProgress.length === 0 ? '<p class="text-xs text-zinc-600">Нет заказов в работе</p>' : inProgress.map(o => `
                            <div class="bg-cardBg border border-zinc-800 rounded-2xl p-4 space-y-2">
                                <div class="flex justify-between text-xs text-zinc-400">

                                </div>
                                <div class="space-y-1">
                                    ${(o.order_items || []).map(i => `<div class="text-sm flex justify-between"><span>${i.product_name} (${i.variant_name})</span><span>${i.quantity} шт. x ${i.price} ₽</span></div>`).join('')}
                                </div>
                                <div class="flex justify-between items-center pt-2 border-t border-zinc-800">
                                    <span class="font-bold text-sm text-accent">Итого: ${o.total_retail} ₽</span>
                                    <button onclick="cancelOrder('${o.id}')" class="px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-400 text-xs rounded-lg transition">Отменить заказ</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="space-y-3 pt-4">
                        <h3 class="text-sm font-semibold text-zinc-400">Выполненные (${completed.length})</h3>
                        ${completed.length === 0 ? '<p class="text-xs text-zinc-600">Нет выполненных заказов</p>' : completed.map(o => `
                            <div class="bg-cardBg border border-zinc-800 rounded-2xl p-4 space-y-2 opacity-75">
                                <div class="flex justify-between text-xs text-zinc-400">
                                    <span>Заказ #${String(o.id).slice(0,6)}</span>
                                    <span>${new Date(o.created_at).toLocaleDateString()}</span>
                                </div>
                                <div class="space-y-1">
                                    ${(o.order_items || []).map(i => `<div class="text-sm flex justify-between"><span>${i.product_name} (${i.variant_name})</span><span>${i.quantity} шт.</span></div>`).join('')}
                                </div>
                                <div class="flex justify-between items-center pt-2 border-t border-zinc-800">
                                    <span class="font-bold text-sm text-zinc-300">Итого: ${o.total_retail} ₽</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderUserProfile(container) {
            const isEditing = state.isProfileEditing;
            container.innerHTML = `
                <div class="space-y-4 max-w-sm mx-auto pt-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold">Профиль пользователя</h2>
                        <button onclick="toggleProfileEdit()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-cardBg border border-zinc-700 hover:bg-zinc-800 text-accent transition">
                            <i data-lucide="${isEditing ? 'x' : 'pencil'}" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="bg-cardBg border border-zinc-800 rounded-2xl p-4 space-y-3">
                        <div>
                            <label class="text-xs text-zinc-400 mb-1 block">Ваш Юз (username)</label>
                            ${isEditing ? `
                                <input type="text" id="profile-username" value="${state.user}" placeholder="@username" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-accent">
                            ` : `
                                <div class="w-full bg-zinc-900/50 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-200">${state.user || '<span class="text-zinc-600">Не указан</span>'}</div>
                            `}
                        </div>
                        <div>
                            <label class="text-xs text-zinc-400 mb-1 block">Номер телефона</label>
                            ${isEditing ? `

        // НОВАЯ ФИЧА: Синхронизация и сохранение профиля в таблицу users в Supabase
        async function saveProfile() {
            const valUser = document.getElementById('profile-username').value.trim();
            const valPhone = document.getElementById('profile-phone').value.trim();
            
            if (!valUser) {
                showToast('Укажите ваш юзернейм!', 'error');
                return;
            }

            state.user = valUser;
            state.phone = valPhone;
            state.isProfileEditing = false;
            
            localStorage.setItem('reflex_username', valUser);
            localStorage.setItem('reflex_phone', valPhone);

            try {
                // Проверяем, есть ли уже запись пользователя в таблице users
                if (state.userId) {
                    await supabaseClient.from('users').update({
                        email: valUser + '@vldvape.local',
                        role: 'user'
                    }).eq('id', state.userId);
                } else {
                    // Ищем по email или создаем новую строку
                    const { data: existingUser } = await supabaseClient.from('users').select('id').eq('email', valUser + '@vldvape.local').single();
                    
                    if (existingUser) {
                        state.userId = existingUser.id;
                        localStorage.setItem('reflex_user_id', existingUser.id);
                    } else {
                        const { data: newUser, error } = await supabaseClient.from('users').insert({
                            email: valUser + '@vldvape.local',
                            password_hash: 'no_pass',
                            role: 'user'
                        }).select().single();

                        if (!error && newUser) {
                            state.userId = newUser.id;
                            localStorage.setItem('reflex_user_id', newUser.id);
                        }
                    }
                }
                showToast('Профиль успешно сохранен и синхронизирован с базой!');
            } catch (e) {
                console.error(e);
                showToast('Профиль сохранен локально', 'success');
            }

            render();
        }

        function initChart(completedOrders) {
            try {
                const canvas = document.getElementById('statsChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (state.chartInstance) state.chartInstance.destroy();

                const daysMap = {};
                completedOrders.forEach(o => {
                    const date = new Date(o.created_at).toLocaleDateString();
                    if (!daysMap[date]) daysMap[date] = { rev: 0, prof: 0 };
                    daysMap[date].rev += Number(o.total_retail);
                    daysMap[date].prof += Number(o.total_retail) - Number(o.total_wholesale);
                });

                const labels = Object.keys(daysMap);
                const revData = labels.map(l => daysMap[l].rev);
                const profData = labels.map(l => daysMap[l].prof);

                state.chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels.length ? labels.reverse() : ['Нет данных'],
                        datasets: [
                            {
                                label: 'Выручка',
                                data: revData.length ? revData.reverse() : [0],
                                borderColor: '#7c3aed',
                                backgroundColor: 'rgba(124, 58, 237, 0.1)',
                                fill: true,
                                tension: 0.3
                            },
                            {
                                label: 'Прибыль',
                                data: profData.length ? profData.reverse() : [0],
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                fill: true,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { labels: { color: '#a1a1aa', font: { size: 10 } } } },
                        scales: {
                            x: { ticks: { color: '#71717a' }, grid: { color: '#27272a' } },
                            y: { ticks: { color: '#71717a' }, grid: { color: '#27272a' } }
                        }
                    }
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function saveDiscount(clearDiscount) {
            const productId = document.getElementById('discount-product-id').value;
            const product = (state.products || []).find(p => p.id == productId);
            if (!product) return;

            const oldPrice = product.old_price && product.old_price > product.retail_price ? product.old_price : product.retail_price;
            let newRetailPrice = Number(document.getElementById('discount-new-price').value);

            if (clearDiscount || !newRetailPrice || newRetailPrice >= oldPrice) {
                await supabaseClient.from('products').update({ retail_price: oldPrice, old_price: null }).eq('id', productId);
                showToast('Акция успешно убрана');
            } else {
                await supabaseClient.from('products').update({ retail_price: newRetailPrice, old_price: oldPrice }).eq('id', productId);
                showToast('Акция и скидка успешно применены!');

            closeModal('modal-discount-form');
            await fetchProducts();
            render();
